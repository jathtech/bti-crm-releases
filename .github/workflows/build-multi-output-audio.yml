name: build-multi-output-audio

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "audio-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish multi-output-audio/MultiOutputAudio.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MultiOutputAudio-win-x64
          path: publish/MultiOutputAudio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/audio-v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MultiOutputAudio.exe
